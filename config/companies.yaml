# Companies to track. One entry per careers page.
#
#   id               short unique name (used in the database)
#   adapter          greenhouse | workday | hrxml | html | browser   (see jobradar/adapters/)
#   url              the careers / job-list page
#   default_location used when a posting has no location text (e.g. a Budapest-only page)
#   enabled          false = skip (page not found yet, or covered by another source)
#   options          adapter settings, e.g. link_pattern (regex a job link must match)
#
# After the first run, open RUN_REPORT.md: sources with 0 jobs or a "spike" usually need
# a better link_pattern, or switching from html to browser.

companies:

  # ---------------- Consulting ----------------
  - id: mckinsey
    name: McKinsey & Company
    category: Consulting
    adapter: browser
    url: https://www.mckinsey.com/careers/search-jobs
    enabled: false
    options: {link_pattern: "/careers/search-jobs/jobs/"}
    notes: Disabled - the site refuses automated browsers (HTTP2 protocol error on first run). Use McKinsey's own job alerts instead.

  - id: bcg
    name: BCG
    category: Consulting
    adapter: browser
    url: https://careers.bcg.com/global/en/locations/hungary-romania
    default_location: Budapest / Bucharest
    options: {link_pattern: "/job/"}

  - id: roland-berger
    name: Roland Berger
    category: Consulting
    adapter: browser
    url: https://www.rolandberger.com/en/Join/All-Jobs.html
    options: {link_pattern: "/Join/.+/"}

  - id: deloitte
    name: Deloitte
    category: Consulting
    adapter: html
    url: https://apply.deloittece.com/en_US/careers/SearchJobs/?523=%5B5514%5D&523_format=1482&listFilterMode=1&jobRecordsPerPage=50
    options: {link_pattern: "/JobDetail/"}
    notes: Deloitte Central Europe portal (Avature); location filter in the URL.

  - id: ey
    name: EY
    category: Consulting
    adapter: html
    url: https://careers.ey.com/ey/search/?locationsearch=Budapest
    default_location: Budapest
    options: {link_pattern: "/ey/job/"}

  - id: pwc-cee
    name: PwC
    category: Consulting
    adapter: browser
    url: https://jobs-cee.pwc.com/hu/hu/search-results
    default_location: Hungary
    options: {link_pattern: "/job/"}

  - id: pwc-campus
    name: PwC (graduate programmes)
    category: Consulting
    adapter: workday
    url: https://pwc.wd3.myworkdayjobs.com/en-US/Global_Campus_Careers
    options: {host: pwc.wd3.myworkdayjobs.com, tenant: pwc, site: Global_Campus_Careers, search_text: Hungary}

  - id: kpmg-gs
    name: KPMG Global Services Hungary
    category: Consulting
    adapter: html
    url: https://kpmgglobalservices.teamtailor.com/jobs
    default_location: Budapest
    options: {link_pattern: "/jobs/\\d+"}

  - id: accenture
    name: Accenture
    category: Consulting
    adapter: browser
    url: https://www.accenture.com/hu-en/careers/jobsearch
    default_location: Hungary
    options: {link_pattern: "jobdetails"}

  # ---------------- Finance ----------------
