      link_pattern: "article_read"
      # The page lists every news article ever published. Keep only job ads and internship calls...
      title_pattern: "Álláshirdetés|munkatársat keres|elemzőt keres|Gyakornoki program|internship|vacancy"
      # ...and only recent ones (article ids grow over time; 3600 = early 2026).
      min_url_number: 3600
    notes: Jobs are posted as news items. Raise min_url_number now and then so old ads drop out.

