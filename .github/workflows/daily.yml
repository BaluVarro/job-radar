name: Job scrape (Mon, Wed, Fri)

on:
  schedule:
    # minute hour day-of-month month day-of-week (1 = Monday, 3 = Wednesday, 5 = Friday)
    # 05:17 UTC = 06:17 Budapest in winter, 07:17 in summer
    - cron: "17 5 * * 1,3,5"
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      reset:
        description: "Optional: company ids to wipe and re-scrape, comma-separated (e.g. political-capital)"
        required: false
        default: ""

permissions:
  contents: write            # needed to commit the updated data back to the repo

concurrency:
  group: job-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape career pages
        env:
          RESET: ${{ github.event.inputs.reset }}
        run: |
          if [ -n "$RESET" ]; then
            python -m jobradar --reset "$RESET"
          else
            python -m jobradar
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/jobs.json docs/health.json logs RUN_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Job scrape $(date -u +%F)"
          # If you pushed code while the scrape was running, a plain push is rejected.
          # Fetch your new commits first, put the results on top, then push (3 tries).
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Results saved."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "::error::Could not save the results to the repository."
          exit 1

      - name: Show summary
        if: always()
        run: cat RUN_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
