name: Daily job scrape

on:
  schedule:
    - cron: "17 5 * * *"     # every day 05:17 UTC (06:17 Budapest in winter)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated data back to the repo

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape career pages
        run: python -m jobradar

      - name: Commit results
        if: always()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/jobs.json docs/health.json logs RUN_REPORT.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Daily scrape $(date -u +%F)"
            git push
          fi

      - name: Show summary
        if: always()
        run: cat RUN_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
